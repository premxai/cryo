worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=v1:10m rate=120r/m;

    server {
        listen 80;
        server_name _;

        # Authenticated SaaS API — app enforces per-key limits; this zone is a
        # coarse per-IP safety net. Long read timeout: Wayback live fetches and
        # cold CDX list-domain queries run 20-75s; /v1/answer up to ~30s.
        location /v1/ {
            limit_req zone=v1 burst=30 nodelay;
            proxy_pass http://127.0.0.1:8000/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
        }

        # Public playground proxy (strict app-level per-IP limits)
        location /demo/ {
            limit_req zone=v1 burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000/demo/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 90s;
        }

        # MCP streamable HTTP — no buffering, long-lived requests
        location /mcp {
            limit_req zone=v1 burst=30 nodelay;
            proxy_pass http://127.0.0.1:8000/mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
        }

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /healthz/ {
            proxy_pass http://127.0.0.1:8000/healthz/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
